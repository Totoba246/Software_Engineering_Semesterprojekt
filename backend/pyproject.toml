# Describes our Python package "batterywatch" (the folder backend/batterywatch).
# Optional: `python -m pip install -e backend` (from the project folder) registers
# that folder with your Python, so `import batterywatch` works from anywhere.
# Not needed for start.py or for the tests (pytest and VS Code find it anyway).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batterywatch"
version = "0.1.0"
description = "BatteryWatch backend: MQTT collector, REST API and developer tools"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["batterywatch*"]

[tool.setuptools.package-data]
batterywatch = ["schema.sql"]

# Settings for the test runner pytest (run `python -m pytest` in backend/)
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
