# =============================================================================
#  nginx = the web server inside the "frontend" container
# =============================================================================
#  The browser talks ONLY to nginx (server port 20800 -> port 80 in here).
#  nginx then decides:
#    http://<server>:20800/api/devices   -> passes it on to the api container (port 8000)
#    http://<server>:20800/anything-else -> sends the web page files (index.html, JS, CSS)
#  Because both come from the same address, the browser never needs to know
#  where the API really runs.
# =============================================================================

server {
    # Port inside the container (docker-compose.yml maps server port 20800 to it).
    listen 80;
    # Folder with the built web page (copied there by frontend/Dockerfile).
    root /usr/share/nginx/html;

    # Data requests from the web page -> our Python API.
    # "api" is the container name from docker-compose.yml, 8000 its internal port.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else: the web page. Addresses like /geraete/101 don't exist
    # as files - React handles them in the browser - so nginx answers with
    # index.html whenever no real file matches ("single page app").
    location / {
        try_files $uri /index.html;
    }

    # Built JS/CSS files have a hash in their name and never change -> let the
    # browser cache them for a year (faster page loads).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
