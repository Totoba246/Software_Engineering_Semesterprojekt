# =============================================================================
#  Settings for OUR OWN test MQTT broker (the "mqtt" container, ADR-05)
# =============================================================================
#  What is an MQTT broker? A post office for small messages:
#   - senders ("publishers", e.g. a node) drop a message at an address ("topic"),
#     e.g. traffic-nodes/101/measurements
#   - receivers ("subscribers", e.g. our collector) say which topics they want
#   - the broker hands every message to everyone subscribed to its topic.
#
#  This broker is only for testing (the test publisher sends fake nodes here).
#  The REAL nodes use the course broker mqtt.ti-labs.ai:8883 instead.
#  Port 20883 on your computer/the server -> port 1883 below (see docker-compose.yml).
# =============================================================================

# Listen for MQTT connections on port 1883 (the standard unencrypted MQTT port).
listener 1883
# No username/password needed. OK only because the port is bound to 127.0.0.1
# (reachable only from the server itself) - never expose this publicly.
allow_anonymous true

# Remember waiting messages across restarts (stored in the mqtt-data volume).
persistence true
persistence_location /mosquitto/data/

# Mosquitto drops QoS 1 messages for a subscriber whose queue is full
# (default 1000). Raise it so short collector restarts / bulk test sends lose nothing.
max_queued_messages 20000

# Write log messages to the container output (`docker compose logs mqtt`).
log_dest stdout
log_type error
log_type warning
log_type notice
