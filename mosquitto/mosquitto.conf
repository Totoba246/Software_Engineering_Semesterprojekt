# Local MQTT broker for development and tests (ADR-05).
# No authentication: only bind it to localhost (see docker-compose.yml).
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Mosquitto drops QoS 1 messages for a subscriber whose queue is full
# (default 1000). Raise it so short collector restarts / bulk test sends lose nothing.
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
